name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://25lion52.github.io/JellyfinHyperionGrabber/roadmap/) first, your idea may already be planned.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work from the user's point of view?

  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Jellyfin version and client, Hyperion.ng/HyperHDR version, LED devices. Helps us judge priority.
