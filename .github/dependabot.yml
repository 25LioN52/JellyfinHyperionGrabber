version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    ignore:
      # Pinned per Jellyfin line in Directory.Packages.props (lowest supported release). Bump deliberately.
      - dependency-name: Jellyfin.*
    groups:
      testing:
        patterns:
          - xunit*
          - Microsoft.Testing.*
          - Microsoft.Extensions.*.Testing
          - NSubstitute
          - Google.FlatBuffers
      analyzers:
        patterns:
          - StyleCop.Analyzers

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    commit-message:
      prefix: docs
