name: Claude review

# Every non-draft PR from this repository gets a review by Claude Code, following .claude/skills/review-pr/SKILL.md.
# Needs the Claude GitHub App and one secret: CLAUDE_CODE_OAUTH_TOKEN (claude setup-token) or ANTHROPIC_API_KEY.
# See docs/development/ai-agents.md. PRs from forks are skipped because secrets are not available to them.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, forks and Dependabot (neither forks nor Dependabot runs receive repository secrets).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
          global-json-file: global.json

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the required code reviewer of this repository. The PR branch is checked out.
            Read .claude/skills/review-pr/SKILL.md and follow it exactly.
            Post findings as inline comments with mcp__github_inline_comment__create_inline_comment (confirmed: true)
            and one summary comment with `gh pr comment` that ends with the verdict line defined in the skill.
            Only post GitHub comments; do not reply with review text as a message.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(dotnet format:*),Bash(git log:*),Bash(git diff:*)"
