name: Docs & plugin repository

# Publishes https://25lion52.github.io/JellyfinHyperionGrabber/ : the documentation site plus manifest.json,
# the Jellyfin plugin repository. The manifest is regenerated from the GitHub releases on every deployment.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - build/plugin.json
      - build/New-PluginManifest.ps1
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - build/plugin.json
      - build/New-PluginManifest.ps1
      - .github/workflows/docs.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Build docs (broken links fail the build)
        run: mkdocs build --strict

      - name: Build plugin repository manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = @(gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --exclude-pre-releases --limit 200 --json tagName --jq '.[].tagName')
          # Never publish an empty catalog because listing failed: that would hide every version from users.
          if ($LASTEXITCODE -ne 0) { throw 'Listing releases failed.' }
          foreach ($tag in $tags) {
            gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern manifest-versions.json --dir "release-manifests/$tag"
            if ($LASTEXITCODE -ne 0) { Write-Warning "Release $tag has no manifest-versions.json; skipped." }
          }
          ./build/New-PluginManifest.ps1 -VersionsDirectory release-manifests -OutputPath site/manifest.json
          exit 0

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
