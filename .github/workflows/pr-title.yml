name: PR title

# PRs are squash-merged, so the PR title becomes the commit on main that release-please reads.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            deps
            refactor
            test
            ci
            build
            chore
          # Only the type matters to release-please. No subject case rule: Dependabot writes "deps: Bump ...".
          requireScope: false
