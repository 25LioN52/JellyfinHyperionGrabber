name: PR title

# PRs are squash-merged, so the PR title becomes the commit on main that release-please reads.
# `pull_request`, not `pull_request_target`: GitHub does not start `pull_request_target` for the release PR, which the
# Release workflow opens with its own token, so the required check never reported there. Reading the title needs no
# write access, so the read-only token of fork PRs is enough.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            deps
            refactor
            test
            ci
            build
            chore
          # Only the type matters to release-please. No subject case rule: Dependabot writes "deps: Bump ...".
          requireScope: false
