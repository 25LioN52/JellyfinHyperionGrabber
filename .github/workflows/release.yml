name: Release

# 1. release-please keeps a "chore(main): release x.y.z" PR up to date from Conventional Commits on main.
# 2. Merging that PR creates the tag and GitHub release; this workflow then builds both plugin zips, attaches them
#    with manifest-versions.json, and redeploys the docs site so manifest.json lists the new version.
# See docs/development/releasing.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Build & attach plugin zips
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
          global-json-file: global.json

      - name: Test
        run: dotnet test --solution Jellyfin.Plugin.HyperionGrabber.slnx -c Release

      - name: Package and upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          gh release view $env:TAG --json body --jq .body | Out-File -Encoding utf8 release-notes.md
          ./build/package.ps1 -Version $env:VERSION `
            -SourceUrlBase "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG" `
            -ChangelogFile release-notes.md
          $zips = Get-ChildItem artifacts -Filter '*.zip' | ForEach-Object FullName
          gh release upload $env:TAG @zips artifacts/manifest-versions.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Uploading release assets failed.' }

  pages:
    name: Publish plugin repository
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
